# DepthWizard default configuration (Mode A relative + Mode B DEM-anchored metric DSM).
# Every scientific parameter lives here; nothing is hard-coded in the pipeline.
# Override with DW_CONFIG=<path>, environment variables DW_<KEY>, or per-job options.

model:
  name: da-v2-small-baseline        # entry in models/INDEX.json ("stub" = deterministic test model)
  version: 1.0.0
  verify_hash: true
  device: auto                    # auto | cpu | cuda
  input_size: 518                 # DA-V2 lower-bound side length (multiple of 14)
  size_multiple: 14

model_metric:                     # optional fine-tuned metric nDSM model (tier H) for Mode B tiles
  enabled: true                   # used only if installed (scripts/install_finetuned_model.py); else zero-shot fallback
  name: da-v2-small-ndsm
  version: latest                 # newest installed version (e.g. 2.0.0 after installing v2); pin "1.0.0" to compare
  verify_hash: true

ingest:
  max_image_dim: 6400             # working-grid pixels; larger inputs are area-averaged to it (RAM budget)
  max_upload_mb: 600              # per uploaded file; larger -> 413 UPLOAD_TOO_LARGE
  max_zip_uncompressed_mb: 3000   # zipped Cartosat / Resourcesat product once extracted (zip-bomb guard)
  allowed_extensions: [".png", ".jpg", ".jpeg", ".tif", ".tiff"]

preprocess:
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  resample: bicubic

rdsm:
  method: percentile              # robust min-max normalisation of relative depth to [0, 1]
  percentiles: [1.0, 99.0]
  nodata: -9999.0
  orientation: higher_value_means_higher_surface   # DA-V2 emits inverse-depth-like values: larger = nearer camera = higher surface (nadir assumption)

calib:                            # Mode B two-layer calibration (TL-CSM)
  output_vertical_crs: EGM2008    # declared vertical reference of every absolute output (Copernicus native)
  dem_dir: assets/dem             # bundled DEM tiles (Copernicus GLO-30 COGs) or user DEM upload
  dem_posting_m: 30.0
  dem_priority: [cartodem, copernicus]   # CartoDEM tiles in assets/dem/cartodem/ win where they cover the scene
  cartodem_vertical_crs: auto     # auto: geoid (EGM96) vs ellipsoidal decided by comparison with Copernicus; refused if neither fits
  sigma_cells: 1.5                # normalized-convolution kernel (DEM cells)
  w_min: 0.1                      # below this ground support the raw DEM is used and flagged
  ground_window_m: 60.0           # morphological ground-filter window on the relative structure
  datum_sanity_m: 15.0            # |terrain - DEM| mean offset above this => INVALID (ellipsoid/geoid mix-up)
  anchor_min_n: 5
  anchor_holdout_fraction: 0.3
  anchor_accept_k: 3.0
  anchor_accept_nmad_m: 5.0       # offset accepted when fit NMAD <= max(k*sigma, this) — terrain-layer scatter dominates, not anchor noise

fusion:                           # tiled inference + DEM-preserving detail fusion (core/calib/fusion.py)
  enabled: true
  inference_gsd_m: 0.5            # Mode B imagery is resampled so each tile pixel is ~0.5 m (DA-V2 sees buildings)
  min_upsample: 0.25
  max_upsample: 4.0
  tile_px: 518
  overlap: 0.25
  max_tiles: 400                  # full 0.5 m detail up to ~3.5 km scenes at 0.6 m; CPU ~2 s per tile
  tile_batch: 0                    # tiles per forward pass; 0 = auto (4 on a GPU, 1 on a CPU)
  max_tile_gain: null             # optional cap on per-tile DEM-band gain (m per relative unit)
  anchor_gain_max: 4.0            # plausibility bound on the anchor-fitted detail gain
  mode_a_tiling: true             # Mode A: refine large images with native-resolution tiles
  mode_a_metric_model: true       # Mode A: fine-tuned nDSM model (if installed) instead of zero-shot depth; measured in docs/validation_mode_a.md
  metric_composition: highpass    # metric model + DEM: highpass (DSM = DEM + high-pass nDSM) | terrain_plus_ndsm
  metric_detail_gain: 1.0          # DSM = DEM + g * hp(nDSM); chosen on validation regions (scripts/select_dem_trust.py)
  metric_dem_object_fraction: 0.75 # terrain = DEM - f * lp(nDSM); share of smoothed object height the DEM holds
  metric_ground_max_m: 1.0        # metric model nDSM below this counts as ground

validation:
  border_px: 4
  max_shift_px: 4
  anchor_exclusion_radius_m: 15.0

terrain:
  max_mesh_dim: 768               # heightfield vertices per side sent to the viewer (area-average downsample, factor recorded)
  max_texture_dim: 2048

storage:
  data_dir: data
  jobs_subdir: jobs

server:
  host: 127.0.0.1
  port: 8000
  frontend_dist: frontend/dist
  warm_up_models: true            # load the models when the server starts, not on the first job
