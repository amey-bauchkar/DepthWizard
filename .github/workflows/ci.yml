name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install (CPU torch + pinned deps)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/dev.txt ruff
      - name: Lint (bug classes only; vendored model code excluded)
        run: ruff check --select F,E9,PLE --ignore F811,F841 --exclude ml/registry/vendor backend core scripts ml tests validation packaging
      - name: Tests (stub model; real-model tests skip without weights)
        run: python -m pytest -q -p no:warnings tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type-check + build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run build
